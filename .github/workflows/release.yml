name: Release

# Publishes on a tag: static binaries for six targets, a container image, and
# an attestation tying both back to this workflow and this commit.
#
# There is no long-lived credential anywhere in this workflow. The registry
# login uses the token GitHub mints for the job, and signing uses the OIDC
# identity of the workflow itself, so there is no secret to leak or rotate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the build attest that these artifacts came from this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads tags to work out the version and the changelog, so
          # a shallow clone produces a release that misreports both.
          fetch-depth: 0

      # The chart defaults image.tag to .Chart.AppVersion, so a chart left
      # behind does not fail: it quietly installs the previous engine. Checked
      # here because a tag is the only moment the right answer is known.
      - name: The chart names the version being released
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(awk -F'"' '/^appVersion:/ {print $2}' deploy/helm/truegrain/Chart.yaml)
          if [ "$tag" != "$declared" ]; then
            echo "Chart.yaml appVersion is $declared and this release is $tag."
            echo "helm install would deploy $declared without saying so."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The parity suite runs against real DuckDB. A release must not skip the
      # tests that prove the numbers are right.
      - name: Install DuckDB
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip -d "$HOME/.local/bin"
          rm duckdb.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Anyone downloading a binary can verify which commit and which workflow
      # produced it, rather than trusting that a file on a release page is what
      # it claims to be.
      - name: Attest the binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"

  container:
    name: Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Minted for this job and expires with it.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Both spellings of the version, because the git tag is v0.1.0 and
          # someone reading it will pull ghcr.io/rk-chavali/truegrain:v0.1.0.
          # semver strips the v, so without the second line that pull 404s and
          # the obvious guess is the wrong one.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
          # auto, not true: a prerelease tag must not become the image people
          # get when they ask for no tag at all. This workflow only runs on
          # tags, so the branch condition it replaces could never fire.
          flavor: |
            latest=auto

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters: Graviton and Apple silicon are both ordinary places
          # to run this.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
